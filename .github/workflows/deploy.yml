name: Deploy SUN-FAI website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages environment
        run: |
          echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_ARDAKE_API_BASE=${{ vars.ARDAKE_API_BASE }}" >> "$GITHUB_ENV"
          if [ -n "${{ vars.PAGES_BASE_PATH }}" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=${{ vars.PAGES_BASE_PATH }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.PAGES_CNAME }}" ]; then
            echo "PAGES_CNAME=${{ vars.PAGES_CNAME }}" >> "$GITHUB_ENV"
          fi
      - name: Build static website
        run: npm run build
      - name: Verify internal links
        run: npm run check:links
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
